<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <!-- Path for curved Course Completion Badge text -->
    <path id="badge-arc" d="M 280,240 A 185,185 0 0,1 620,240" fill="none" />
  </defs>

  <!-- Background Terracotta / Rust -->
  <rect width="900" height="600" fill="#CD6747" />

  <!-- Central Faceted Badge Polygon -->
  <polygon points="
    450,48 515,62 585,96 648,150 682,216 695,296 676,375 628,446 565,496 492,525 418,528 342,498 276,448 226,380 205,298 216,218 252,152 312,98 382,62
  " fill="#F1D3C1" stroke="#F1D3C1" stroke-linejoin="round" />

  <!-- Top Arc Text: COURSE COMPLETION BADGE -->
  <text fill="#CD6747" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="7">
    <textPath href="#badge-arc" startOffset="50%" text-anchor="middle">
      COURSE COMPLETION BADGE
    </textPath>
  </text>

  <!-- Chat Bubbles Illustration -->
  <g transform="translate(450, 202)">
    <!-- Terracotta intersection overlap fill -->
    <ellipse cx="-2" cy="-4" rx="14" ry="12" fill="#CD6747" opacity="0.85" />
    
    <!-- Top-Left Bubble Outline -->
    <path d="M -9,3 C -26,3 -40,-9 -40,-26 C -40,-43 -26,-55 -8,-55 C 10,-55 24,-43 24,-26 C 24,-20 22,-14 18,-9 L 22,2 L 10, -1 C 4,1 -2,3 -9,3 Z" 
          fill="none" stroke="#1D1917" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Bottom-Right Bubble Outline -->
    <path d="M 9,-6 C -6,-6 -17,5 -17,21 C -17,27 -14,33 -9,37 L -13,48 L -2,45 C 3,47 7,47 13,47 C 30,47 43,35 43,21 C 43,6 28,-6 9,-6 Z" 
          fill="none" stroke="#1D1917" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Main Title: Claude 101 -->
  <text x="450" y="332" text-anchor="middle" fill="#181514" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="70" font-weight="500" letter-spacing="-0.5">Claude 101</text>

  <!-- Presented to -->
  <text x="450" y="405" text-anchor="middle" fill="#241E1C" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400">Presented to</text>

  <!-- Recipient Name: Ymarri Paulo Estorel -->
  <text x="450" y="448" text-anchor="middle" fill="#181514" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="29" font-weight="600" letter-spacing="0.2">Ymarri Paulo Estorel</text>

  <!-- Footer Left: Claude Sunburst Spark Logo + Claude Academy -->
  <g transform="translate(42, 542)">
    <!-- 8-ray Spark Icon -->
    <g transform="translate(14, 14)" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round">
      <line x1="0" y1="-11" x2="0" y2="11" />
      <line x1="-11" y1="0" x2="11" y2="0" />
      <line x1="-7.8" y1="-7.8" x2="7.8" y2="7.8" />
      <line x1="-7.8" y1="7.8" x2="7.8" y2="-7.8" />
    </g>
    <!-- Claude Academy text -->
    <text x="36" y="21" fill="#FFFFFF" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" font-weight="700" letter-spacing="0.3">Claude Academy</text>
  </g>

  <!-- Footer Right: ISSUED SEPTEMBER 19, 2026 -->
  <text x="858" y="563" text-anchor="end" fill="#FFFFFF" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">ISSUED SEPTEMBER 19, 2026</text>
</svg>
